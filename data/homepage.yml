        x: "img/clients/ztos.png"
        _2x: "img/clients/ztos@2x.png"
      alt: "Ztos"

  works:
    - title: "MLB Game Predictor"
      description: "MLB Game Predictor is a machine learning-driven web application, leveraging over 2,430 game records from the MLB Stats API to forecast game outcomes with 60% accuracy. Powered by Spring Boot and integrating linear regression and random forest models, it processes and filters 20+ datasets using NumPy and Pandas. The platform serves 500+ active users monthly, offering data-driven predictions for baseball enthusiasts."
      button:
        icon: "icon-arrow-right"
        btnText: "View"
        github: "https://github.com/michael-goldfarb/mlbgamepredictor"
        URL: "https://MLBGamePredictor.com"
      image:
        x: "img/works/predictorInGame2.png"
        _2x: "img/works/predictorInGame2.png"
      is_even: true
      
    - title: "OhConnections"
      description: "OhConnections is a baseball-centric web application inspired by the New York Times’ ‘Connections,’ designed to challenge players with MLB-specific grouping puzzles. The platform integrates state management and real-time user interaction logic to deliver a seamless and engaging experience. Within its first month, OhConnections achieved 1,000+ active users, driven by a visually intuitive interface that fosters high retention and user engagement."
      button:
        icon: "icon-arrow-right"
        btnText: "View"
        github: "https://github.com/michael-goldfarb/OhConnections"
        URL: "https://OhConnections.com"
      image:
        x: "img/works/connectionsgame.png"
        _2x: "img/works/connectionsgame.png"
      is_even: false

    - title: "Mountain Hawk Food Finder"
      description: "Mountain Hawk Food Finder is a full-stack iOS application designed to streamline dining at Lehigh University, especially after the closure of a major dining hall limited student options. The app offers daily menus, user-generated item ratings, and real-time business hours. Featuring seamless Apple Maps integration, it enables students to navigate remaining campus eateries efficiently. Built with a robust backend to manage user data and ratings, it provides a visually appealing and intuitive solution to enhance dining convenience amidst changing campus dynamics."
      button:
        icon: "icon-arrow-right"
        btnText: "View"
        github: "https://github.com/michael-goldfarb/MountainHawkFoodFinder"
        URL: "https://github.com/michael-goldfarb/MountainHawkFoodFinder"
      image:
        x: "img/works/app.png"
        _2x: "img/works/app.png"
      is_even: true

    - title: "Solidity Semiswap"
      description: "Solidity Semiswap is a decentralized exchange (DEX) built in Solidity, implementing an ERC-20 to Ether automatic market maker. Designed for a Blockchain Systems class, it allows users to seamlessly provide, estimate, and withdraw liquidity, as well as swap between ERC-20 tokens and Ether. The platform demonstrates core principles of decentralized finance through efficient smart contract design and user-focused functionality."
      button:
        icon: "icon-arrow-right"
        btnText: "View"
        github: "https://github.com/Michael-Goldfarb/soliditysemiswap"
        URL: "https://github.com/Michael-Goldfarb/soliditysemiswap"
      image:
        x: "img/works/semiswap.jpg"
        _2x: "img/works/semiswap.jpg"
      is_even: false


