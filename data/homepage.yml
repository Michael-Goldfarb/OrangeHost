# about
about:
  enable: true
  title: "About Me"
  content: |
    <p class="lead">
    I'm a Software Engineer II at Air. I build backend services and user-facing features for an <span class="bold-blue">AI workflow platform</span>,
    including human review tools, LLM streaming, and file ingestion.
    </p>
    <p class="lead">
    I enjoy building reliable backend systems and <span class="bold-brown">full-stack applications</span>.
    This site also collects projects and research from my time at Lehigh University.
    </p>
    <p class="lead">
    I graduated from Lehigh University with a B.S. in Computer Science and Business.
    </p>
  content2: |
    <p class="lead">
    Earlier projects include an MLB Game Predictor website and the Mountain Hawk Food Finder iOS app.
    </p>
    <p class="lead">
    During a summer research project, I trained mathematical and agent-based models using historical CDC data.
    I also created data visualizations to explore the spread of influenza.
    My team's agent-based influenza modeling project came in <span class="bold-brown">second place</span> in the Lehigh Summer Research Day Expo.
    </p>
    <p class="lead">
    Outside of work, I spend time playing fantasy football, listening to music, and editing videos.
    I have played baseball since elementary school and like to play pick-up basketball with friends.
    I also enjoy participating in <span class="bold-blue">hackathons</span> and <span class="bold-brown">programming challenges</span>.
    </p>
  button:
    icon: "icon-smile-fill"
    btnText: "About Me"
    URL: "https://www.linkedin.com/company/radity/"
  image1:
    x: "img/who-am-i/headshot.jpg"
    _2x: "img/who-am-i/headshot.jpg"
  image2:
    x: "img/who-am-i/laurenstudios1.jpg"
    _2x: "img/who-am-i/laurenstudioss1.jpg"

